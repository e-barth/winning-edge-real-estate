<script async>   
  function addVideoTitles() {
    const videoTitles = [
      ['.md-video .swiper-wrapper .video-item:nth-of-type(1) .video-content', '#video-title-one'],
      ['.md-video .swiper-wrapper .video-item:nth-of-type(2) .video-content', '#video-title-two'],
      ['.md-video .swiper-wrapper .video-item:nth-of-type(3) .video-content', '#video-title-three']
    ];

    videoTitles.forEach(([videoSelector, titleSelector]) => {
      const video = document.querySelector(videoSelector);
      const title = document.querySelector(titleSelector);

      if (video && title) {
        video.insertAdjacentHTML('beforebegin', title.innerHTML);
      }
    });
  }   
  window.addEventListener('load',() => {   
    setTimeout(addVideoTitles, 500);    
  });
</script>
