<div class="videos f-col">
  <div class="grid">    

    <div class="col">
      <h3 class="video-title">MARCH 2026 REAL ESTATE ESTATE MARKET REPORT : MARYLAND MARKET REPORT</h3>
      <button class="thumb" data-video-id="B4QIovvI-j8" aria-label="Play video: Winning Edge Real Estate market update">
        <img src="https://img.youtube.com/vi/B4QIovvI-j8/hqdefault.jpg" alt="Winning Edge Real Estate market update video thumbnail" loading="lazy">
        <span class="play" aria-hidden="true"></span>
      </button>
    </div>

    <div class="col">
      <h3 class="video-title">January 2026 Real Estate Update: Interest Rates, Home Prices & What Buyers and Sellers Must Know</h3>
      <button class="thumb" data-video-id="xBvRjqj--J8" aria-label="Play video: Winning Edge Real Estate market update">
        <img src="https://img.youtube.com/vi/xBvRjqj--J8/hqdefault.jpg" alt="Winning Edge Real Estate market update video thumbnail" loading="lazy">
        <span class="play" aria-hidden="true"></span>
      </button>
    </div>      

  </div>

  <dialog id="lightbox">
    <button class="close-btn" id="close-btn" aria-label="Close video">&#10005;</button>
    <div class="player-wrap">
      <iframe id="player"
        src=""
        title="YouTube video player"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>
    </div>
  </dialog>
</div>

<script>
  const dialog = document.getElementById('lightbox');
  const iframe = document.getElementById('player');
  const closeBtn = document.getElementById('close-btn');
  const thumbs = document.querySelectorAll('.thumb');

  function openLightbox(videoId) {    
    iframe.src = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&rel=0`;
    dialog.showModal();
  }
  function closeLightbox() {
    dialog.close();
  }
  thumbs.forEach(btn => {
    btn.addEventListener('click', () => openLightbox(btn.dataset.videoId));
  });
  closeBtn.addEventListener('click', closeLightbox);
  dialog.addEventListener('click', (e) => {
    if (e.target === dialog) closeLightbox();
  });
  dialog.addEventListener('close', () => {
    iframe.src = '';
  });
</script>
